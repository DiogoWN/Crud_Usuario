<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário</title>
</head>
<body>
    <nav><!--Serve para indicar a área de navegação -->
        <ul>
            <li><a href="index.html">Tela de login</a></li>
            <li><a href="formulario.html">Formulário</a></li>
            <li><a href="lista_usuario.html">Usuários</a></li>
        </ul>
    </nav>

    <!--Serve para criar um formulário que envia as informações-->
    <form action="/usuario" method="post" id="formulario">
        <h2>Digite suas informações</h2>
         
        Digite seu Nome <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui" required>
        Digite seu E-mail <input type="email" id="email" name="email" placeholder="Digite seu e-mail aqui"required>
        Digite seu CPF <input type="text" id="cpf" name="cpf" placeholder="Digite seu cpf aqui" required>
        Digite seu Telefone <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone aqui">
        Digite sua Data de nascimento <input type="date" id="data_nascimento" name="data_nascimento" required>
            <br>
        <button type="submit">Enviar Dados</button>
    </form>
</body>
</html>
